[package]
name = "sloppytoppy"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Terminal process and token monitor for Claude Code and Codex agents"
license = "MIT"
repository = "https://github.com/galenoshea/sloppytoppy"

readme = "README.md"
keywords = ["ai-agents", "claude", "codex", "monitoring", "terminal"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "target/"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.38.4"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
